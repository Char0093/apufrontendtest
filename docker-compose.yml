services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - corp-brain-net

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    networks:
      - corp-brain-net

  fastapi-backend:
    build: ./backend
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: sqlite:///./corporate_brain.db
      STORAGE_PATH: storage
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - neo4j
    networks:
      - corp-brain-net

  celery-worker:
    build: ./backend
    command: celery -A app.core.celery_app worker --loglevel=info
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: sqlite:///./corporate_brain.db
      STORAGE_PATH: storage
    depends_on:
      - redis
      - neo4j
    networks:
      - corp-brain-net

  frontend-dev:
    build: ./frontend
    ports:
      - "5173:5173"
    networks:
      - corp-brain-net

networks:
  corp-brain-net:

volumes:
  neo4j-data:
